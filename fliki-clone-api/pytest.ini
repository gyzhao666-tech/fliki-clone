[pytest]
# 测试发现：从 tests/ 目录开始；命名按 pytest 默认（test_*.py）
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# pytest-asyncio：用 strict 模式让 async 测试必须显式标 @pytest.mark.asyncio，
# 避免老的同步 case 误被 event loop 包住。当前所有 case 都是同步的，
# strict 让测试意图显式。
asyncio_mode = strict

# marker 注册（避免 "unknown mark" warning）
markers =
    unit: 纯单元测试 —— 不依赖 PG / 外网 / ffmpeg
    integration: 集成测试 —— 需要本地可用的 PostgreSQL（默认 fliki 库）
    slow: 跑得久的算法 / 字符串扫描 case
    publishing: 发布执行器相关
    quota: 配额 v2 相关
    voice: VoiceAgent v4 相关
    art: ArtAgent v3 相关

# 控制台输出：默认短回溯 + 摘要；CI 想要更多 detail 时手动加 -vv
addopts = -ra --strict-markers --tb=short

# 过滤已知 warning（避免 SQLAlchemy / pydantic 的 deprecation 噪音）
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:pydantic_settings.*
    ignore::DeprecationWarning:sqlalchemy.*
    ignore::PendingDeprecationWarning
